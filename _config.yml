# =========================================================================
#  极简纯文本博客配置（无第三方主题，layout 与样式都在本仓库里）
#  本地预览: bundle exec jekyll serve
# =========================================================================

title: "Nekow33Blooooooooooooog"
description: ""
author: "Nekow33"
lang: "zh-CN"

url: "https://nekow33.github.io"
baseurl: ""

# ------------------------- 文件处理 -------------------------
include:
  - _pages

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules

# ------------------------- 输出 / 分页 -------------------------
# 与旧 Hugo 站一致的 URL 结构：/posts/<文件名的日期>-<标题>/
permalink: /posts/:year-:month-:day-:title/
paginate: 5
paginate_path: "/page:num/"
timezone: Asia/Shanghai

# ------------------------- 插件 -------------------------
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed

# ------------------------- Markdown / 代码高亮 -------------------------
markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  smart_quotes: apos,apos,quot,quot # 保留直引号，老式观感
  enable_coderay: false

# ------------------------- 默认值 -------------------------
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      toc: true # 文章默认生成右侧目录，单篇可写 toc: false 关掉
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: page
