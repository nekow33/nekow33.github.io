# =========================================================================
#  极简纯文本博客配置（无第三方主题，layout 与样式都在本仓库里）
#  本地预览: bundle exec jekyll serve
# =========================================================================

title: "Scotws's Blogs"
description: "个人技术笔记与折腾记录。"
author: "Scotws"
lang: "zh-CN"

url: "https://nekow33.github.io"
baseurl: ""

# ------------------------- 允许文章时间随意 -----------------
# 文章的时间可以是未来时间
future: true

# ------------------------- 文章目录 -------------------------
# 文章放在 _articles/ 下，文件名不需要带日期（不像 _posts 那样强制 YYYY-MM-DD-）
# URL 规则：/posts/<文件名>/
collections:
  articles:
    output: true
    permalink: /posts/:name/
    sort_by: date

# ------------------------- 文件处理 -------------------------
include:
  - _pages

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules

timezone: Asia/Shanghai

# ------------------------- 插件 -------------------------
plugins:
  - jekyll-sitemap

# ------------------------- Markdown / 代码高亮 -------------------------
markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  smart_quotes: apos,apos,quot,quot # 保留直引号，老式观感
  enable_coderay: false

# ------------------------- 默认值 -------------------------
defaults:
  - scope:
      path: ""
      type: articles
    values:
      layout: post
      toc: true # 默认生成左侧目录，单篇可写 toc: false 关掉
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: page
